<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Eidan Cuadros — Junior Software Developer</title>
  <desc id="d">Banner del perfil: Eidan Cuadros, desarrollador junior de backend y automatización en Floridablanca, Colombia, con un robot pixel art que rueda sobre un editor de código</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F14"/>
      <stop offset=".6" stop-color="#141822"/>
      <stop offset="1" stop-color="#1F2640"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7AA2F7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7AA2F7" opacity=".10"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; font-size: 13.5px; }
    .crawl { animation: crawl 14s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 2.4s ease-out infinite; }
    .cursor { animation: cursor 1.1s steps(1) infinite; }
    @keyframes crawl { 0%, 6% { transform: translateX(0); } 46%, 54% { transform: translateX(220px); } 94%, 100% { transform: translateX(0); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes cursor { 0% { opacity: 1; } 50% { opacity: 0; } }

    .fa { animation: fa .5s steps(1) infinite; }
    .fb { animation: fb .5s steps(1) infinite; }
    .wave-up { animation: fa 1.2s steps(1) infinite; }
    .wave-down { animation: fb 1.2s steps(1) infinite; }
    .bob { animation: bob 1s steps(2) infinite; }
    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
    .led { animation: led 2s ease-in-out infinite; }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
