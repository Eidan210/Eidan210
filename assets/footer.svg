    <text x="500" y="40" fill="#E4E7EE" font-size="19" font-weight="700" text-anchor="middle">Gracias por pasar.</text>
    <text x="500" y="64" fill="#99A1B3" font-size="15" text-anchor="middle">Si algo de lo que ves te interesa, escríbeme.</text>
