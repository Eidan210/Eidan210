<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 132" width="1000" height="132" role="img" aria-labelledby="t d">
  <title id="t">Gracias por pasar</title>
  <desc id="d">El robot del perfil rueda junto al mensaje: gracias por pasar, si algo te interesa, escríbeme</desc>
  <defs><clipPath id="frame"><rect width="1000" height="132" rx="16"/></clipPath></defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .crawl { animation: crawl 18s linear infinite; }
    @keyframes crawl { 0% { transform: translateX(0); } 50% { transform: translateX(880px); } 100% { transform: translateX(0); } }

    .fa { animation: fa .5s steps(1) infinite; }
    .fb { animation: fb .5s steps(1) infinite; }
    .wave-up { animation: fa 1.2s steps(1) infinite; }
    .wave-down { animation: fb 1.2s steps(1) infinite; }
    .bob { animation: bob 1s steps(2) infinite; }
    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
    .led { animation: led 2s ease-in-out infinite; }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
