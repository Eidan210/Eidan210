<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-labelledby="t d">
  <title id="t">Cómo trabajo</title>
  <desc id="d">Cuatro principios: diagnóstico antes que parche, commits atómicos, README que explica la decisión y nativo antes que dependencia</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .title { fill: #1f2328; font-size: 19px; font-weight: 700; }

    .card { fill: #ffffff; stroke: #d0d7de; }
    .hl { fill: #eef3ff; stroke: #7AA2F7; }
    .name { fill: #1f2328; font-size: 16px; font-weight: 700; }
    .item { fill: #59636e; font-size: 13.5px; }
    .tag { fill: #59636e; font-size: 13px; font-weight: 600; }
    .arrow { fill: none; stroke: #8c959f; stroke-width: 2; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .hl { fill: #1a2236; stroke: #7AA2F7; }
      .name { fill: #f0f6fc; }
      .item, .tag { fill: #9198a1; }
      .title { fill: #f0f6fc; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }

    .fa { animation: fa .5s steps(1) infinite; }
    .fb { animation: fb .5s steps(1) infinite; }
    .wave-up { animation: fa 1.2s steps(1) infinite; }
    .wave-down { animation: fb 1.2s steps(1) infinite; }
    .bob { animation: bob 1s steps(2) infinite; }
    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
    .led { animation: led 2s ease-in-out infinite; }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <g transform="translate(4 52)"><rect class="card" width="492" height="140" rx="14"/><path d="M14 0 H478 A14 14 0 0 1 492 14 V16 H0 V14 A14 14 0 0 1 14 0 Z" fill="#7AA2F7"/><circle cx="46" cy="66" r="24" fill="#7AA2F7"/><g transform="translate(46 66)"><circle cx="-3" cy="-3" r="8" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M3 3 L10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><text class="title" x="88" y="62">Diagnóstico antes que parche</text><text class="item" x="88" y="90">Reproduzco el fallo, aíslo la causa y corrijo</text><text class="item" x="88" y="112">el origen, no el síntoma.</text></g><g transform="translate(504 52)"><rect class="card" width="492" height="140" rx="14"/><path d="M14 0 H478 A14 14 0 0 1 492 14 V16 H0 V14 A14 14 0 0 1 14 0 Z" fill="#BB9AF7"/><circle cx="46" cy="66" r="24" fill="#BB9AF7"/><g transform="translate(46 66)"><path d="M-11 0 H11" stroke="#fff" stroke-width="2.2"/><circle cx="-7" r="3.6" fill="#7AA2F7" stroke="#fff" stroke-width="2.2"/><circle cx="7" r="3.6" fill="#7AA2F7" stroke="#fff" stroke-width="2.2"/></g><text class="title" x="88" y="62">Commits atómicos</text><text class="item" x="88" y="90">Conventional Commits e historial legible, en</text><text class="item" x="88" y="112">vez de un volcado de cambios al final.</text></g><g transform="translate(4 208)"><rect class="card" width="492" height="140" rx="14"/><path d="M14 0 H478 A14 14 0 0 1 492 14 V16 H0 V14 A14 14 0 0 1 14 0 Z" fill="#9ECE6A"/><circle cx="46" cy="66" r="24" fill="#9ECE6A"/><g transform="translate(46 66)"><path d="M-8 -11 H4 L9 -6 V11 H-8 Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-4 -2 H5 M-4 3 H5 M-4 8 H2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g><text class="title" x="88" y="62">README que explica la decisión</text><text class="item" x="88" y="90">Documento por qué se hizo así, no solo cómo</text><text class="item" x="88" y="112">se instala.</text></g><g transform="translate(504 208)"><rect class="card" width="492" height="140" rx="14"/><path d="M14 0 H478 A14 14 0 0 1 492 14 V16 H0 V14 A14 14 0 0 1 14 0 Z" fill="#E0AF68"/><circle cx="46" cy="66" r="24" fill="#E0AF68"/><g transform="translate(46 66)"><path d="M9 -11 C-6 -9 -10 4 -10 11 M-10 11 C-2 9 8 2 9 -11 M-4 3 L3 -4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text class="title" x="88" y="62">Nativo antes que dependencia</text><text class="item" x="88" y="90">Mido lo que cuesta mantener algo antes de</text><text class="item" x="88" y="112">instalarlo.</text></g>
