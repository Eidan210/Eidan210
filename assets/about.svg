  <rect x="186" y="250" width="234" height="28" rx="14" fill="#7AA2F7" fill-opacity=".14" stroke="#7AA2F7" stroke-opacity=".6"/><text class="chip" x="303" y="269" text-anchor="middle">Bases de datos relacionales</text><rect x="429.9" y="250" width="111" height="28" rx="14" fill="#7AA2F7" fill-opacity=".14" stroke="#7AA2F7" stroke-opacity=".6"/><text class="chip" x="485" y="269" text-anchor="middle">Spring Boot</text><rect x="550.6" y="250" width="64" height="28" rx="14" fill="#7AA2F7" fill-opacity=".14" stroke="#7AA2F7" stroke-opacity=".6"/><text class="chip" x="583" y="269" text-anchor="middle">Scrum</text><rect x="625.1" y="250" width="80" height="28" rx="14" fill="#7AA2F7" fill-opacity=".14" stroke="#7AA2F7" stroke-opacity=".6"/><text class="chip" x="665" y="269" text-anchor="middle">Java 21</text>
